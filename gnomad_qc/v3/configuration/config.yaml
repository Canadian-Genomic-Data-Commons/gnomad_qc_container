paths:
  base_dir:
  write_dir:
  log_dir:
  code_dir:
  vds_file:

spark:
  driver_memory:
  executor_memory:
  executor_instances:
  executor_cores:
  dynamic_allocation: "false"
  shuffle_service: "false"
  local_dir:
  memory_fraction: "0.8"

java:
  tool_options: "-XX:+UseG1GC -XX:G1HeapRegionSize=32M"

# Reference genome FASTA files. GRCh38 has no public default -- point these at
# your own copy (see the prerequisite-file downloads in the system requirements
# doc). The GRCh37 defaults are public Hail buckets and only work if compute
# nodes have internet access.
reference:
  grch38_fasta: "/home/kobe/scratch/gnomad/Homo_sapiens_assembly38.fasta.gz"
  grch38_fasta_index: "/home/kobe/scratch/gnomad/Homo_sapiens_assembly38.fasta.gz.fai"
  grch37_fasta: 
  grch37_fasta_index: 


  # Local mirror of gnomAD's public resources, for clusters whose compute nodes
  # have no internet. Without this, gnomad_methods resolves those resources to
  # gs:// URLs and steps hang for ~100s before failing with NoRouteToHost.
  # Mirror the structure that follows the bucket name, e.g. a resource at
  # gs://gnomad-public-requester-pays/resources/grch38/x.ht must live at
  # <public_resource_dir>/resources/grch38/x.ht
  public_resource_dir:
