paths:
  base_dir:
  write_dir:
  log_dir:
  code_dir:
  vds_file:
  # Hail's scratch directory. Use node-local disk, not a parallel filesystem;
  # unset means /tmp, which is small inside a container. Environment variables
  # are expanded, so on Slurm this can be '${SLURM_TMPDIR}/hail'.
  tmp_dir:

spark:
  driver_memory:
  executor_memory:
  executor_instances:
  executor_cores:
  dynamic_allocation: "false"
  shuffle_service: "false"
  local_dir:
  memory_fraction: "0.8"

java:
  tool_options: "-XX:+UseG1GC -XX:G1HeapRegionSize=32M"

# Reference genome FASTA files
reference:
  grch38_fasta:
  grch38_fasta_index:

  # Hail VEP config JSON for the vep step, which runs on the host (see
  # host/run_vep.sh). Its "command" launches VEP, e.g. a wrapper script around a
  # VEP container, and its "vep_json_schema" decides which VEP fields are kept.
  vep_config:

  # Local copy of gnomAD's public resources, for compute nodes without
  # internet access.
  public_resource_dir:
