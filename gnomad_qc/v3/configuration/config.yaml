paths:
  base_dir:
  write_dir:
  log_dir:
  code_dir:
  vds_file:
  # Hail's scratch directory, separate from spark.local_dir below. Both should
  # be fast node-local disk, not a parallel filesystem. Leaving this unset means
  # Hail uses /tmp, which inside a container is small and may not persist for a
  # whole query. Environment variables are expanded, so on Slurm this can be
  # '${SLURM_TMPDIR}/hail'.
  tmp_dir:

spark:
  driver_memory:
  executor_memory:
  executor_instances:
  executor_cores:
  dynamic_allocation: "false"
  shuffle_service: "false"
  local_dir:
  memory_fraction: "0.8"

java:
  tool_options: "-XX:+UseG1GC -XX:G1HeapRegionSize=32M"

# Reference genome FASTA files
reference:
  grch38_fasta:
  grch38_fasta_index:

  # Local mirror of gnomAD's public resources
  public_resource_dir:
